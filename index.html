<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>3D2SIRD — стенд генератора</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #222;
      }
      body.dragover {
        outline: 3px dashed #4a90d9;
        outline-offset: -8px;
      }
      main {
        max-width: 1200px;
      }
      p {
        max-width: 70ch;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px 20px;
        margin: 16px 0;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      .controls label {
        display: block;
        font-size: 0.85rem;
      }
      .controls input[type='range'] {
        width: 100%;
      }
      .controls output {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .views {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 12px;
      }
      .views figure {
        margin: 0;
      }
      .views figcaption {
        font-size: 0.8rem;
        color: #666;
        margin-top: 4px;
      }
      #status {
        font-variant-numeric: tabular-nums;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #scene-view {
        width: 320px;
        height: 240px;
        border: 1px solid #ccc;
        cursor: grab;
        image-rendering: auto;
      }
      #depth-preview {
        width: 240px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <!-- Временный стенд для подбора параметров глазами. Настоящий UI
         появится в src/ui/ (STATUS.md, беклог). -->
    <main>
      <h1>Стенд: стереограмма</h1>
      <p>
        Смотреть «сквозь» экран — параллельный взгляд, как на Magic Eye. Модель
        слева можно крутить мышью, стереограмма пересчитается под новый угол.
        Свою модель — перетащите файл <code>.glb</code> на страницу.
      </p>

      <div class="controls">
        <label>
          Модель
          <select id="object">
            <option value="sphere">Сфера</option>
            <option value="torus">Тор</option>
            <option value="knot">Тор-узел</option>
            <option value="hemisphere">Полусфера (синтетика, без scene/depth)</option>
            <option value="loaded" hidden>Загруженная модель</option>
          </select>
        </label>
        <label>
          Свой файл .glb
          <input id="file" type="file" accept=".glb,.gltf,model/gltf-binary" />
        </label>
        <label>
          E — межзрачковое расстояние, px: <output id="eye-out"></output>
          <input id="eye" type="range" min="60" max="300" step="10" value="180" />
        </label>
        <label>
          μ — сила рельефа: <output id="mu-out"></output>
          <input id="mu" type="range" min="0.1" max="0.9" step="0.05" value="0.45" />
        </label>
        <label>
          Размытие карты глубины, px: <output id="blur-out"></output>
          <input id="blur" type="range" min="0" max="6" step="1" value="2" />
        </label>
        <label>
          Подъём модели над фоном: <output id="floor-out"></output>
          <input id="floor" type="range" min="0" max="0.6" step="0.05" value="0.35" />
        </label>
        <label>
          <input id="cross-eyed" type="checkbox" />
          Перекрёстный взгляд
        </label>
      </div>

      <p id="status">Генерация…</p>

      <div class="views">
        <figure>
          <canvas id="scene-view"></canvas>
          <figcaption>Сцена — крутите мышью</figcaption>
        </figure>
        <figure>
          <canvas id="depth-preview"></canvas>
          <figcaption>Карта глубины: белое ближе, чёрное — фон</figcaption>
        </figure>
      </div>

      <canvas id="output"></canvas>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
